# configs/hydrate_sphere_hot.yaml
# 球形水合物验证案例（强热驱动版）：初始低温 + 底边大幅升温
# 对应几何：300×300 中心球，半径 50
# 运行入口：scripts/04_run_hydrate_sphere_case.py（使用 --inlet-temp 323.15 K 默认值）
# 与 hydrate_porous.yaml 的区别：T0_inlet=323.15 K（大温差驱动），无多孔介质几何

hydrate:
  enable: true
  start_step: 0

  thermal:
    T0_init: 278.15        # 初始均匀温度（水合物稳定区）
    T0_inlet: 323.15       # 入口强加热，形成大温度梯度
    thermal_bc_side: 0     # 0=底边(y==0) Dirichlet，顶边全展开
    lambda_fluid: 0.6
    lambda_hydrate: 0.49
    lambda_solid: 0.9
    rhocp_fluid: 4200000.0
    rhocp_hydrate: 2100000.0
    rhocp_solid: 2000000.0

  concentration:
    D_mol_water: 1.85e-9
    Henry_KH: 0.1
    Cm_init: 0.0

  reaction:
    k0_rxn: 36000.0
    Ea_rxn: 97500.0
    e1_peq: 33.12
    e2_peq: -9005.5
    latent_heat: 43000.0

  vop:
    Vm_hydrate: 2.274e-5
    Vh_init: 1.0
    vop_terminate_frac: 0.01

  units:
    dx_phys: 1.0e-5
    dt_phys: 1.0e-6

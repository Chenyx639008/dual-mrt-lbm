# configs/hydrate.yaml
# 通用水合物参数基线（保守值，主要供 test_hydrate_validation.py 使用）
# 实际验证案例请使用专用配置：
#   hydrate_sphere_hot.yaml  — 球形单体案例，底边强升温（T_inlet=323.15 K, bc_side=0）
#   hydrate_porous.yaml      — 多孔介质案例，右边界升温（T_inlet=298.15 K, bc_side=3）
# Use with the mcmp_sim_hydrate binary.
# Load alongside default.yaml: load_config("configs/hydrate.yaml")
# This file only overrides the hydrate section; all other params come from default.yaml.

hydrate:
  enable: true
  start_step: 0

  thermal:
    T0_init: 278.15
    T0_inlet: 285.0
    lambda_fluid: 0.6
    lambda_hydrate: 0.49
    lambda_solid: 0.9
    rhocp_fluid: 4200000.0
    rhocp_hydrate: 2100000.0
    rhocp_solid: 2000000.0

  concentration:
    D_mol_water: 1.85e-9
    Henry_KH: 0.1
    Cm_init: 0.0

  reaction:
    k0_rxn: 36000.0
    Ea_rxn: 97500.0
    e1_peq: 33.12
    e2_peq: -9005.5
    latent_heat: 43000.0

  vop:
    Vm_hydrate: 2.274e-5
    Vh_init: 1.0
    vop_terminate_frac: 0.01

  units:
    dx_phys: 1.0e-5
    dt_phys: 1.0e-6

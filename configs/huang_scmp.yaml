# configs/huang_scmp.yaml
# Huang & Wu (2016) SCMP single-component multiphase configuration.
# Used with mcmp_huang_256 binary.
#
# IMPORTANT: cs_T is REDUCED temperature T/Tc (per paper Section 6.3: T=0.9Tc).
# The solver multiplies cs_T by Tc internally to get actual T.
# Tc = 0.3773 * cs_a / (cs_b * cs_R) = 0.09433 for a=1,b=4,R=1.

project:
  name: huang_scmp
  notes: "Huang & Wu (2016) SCMP validation — Carnahan-Starling EOS"

# ── Physics mode ──
huang_scmp:
  pp_mode: 1            # SCMP (required for mcmp_huang_256)
  epsilon_huang: 1.7       # ε empirically tuned (NOT paper's −2/3). k₁=−ε/8=−0.2125
  k2_huang: 0.0         # secondary σ parameter
  kd_huang: -0.083333   # fixed constant kd=-1/12 (paper Section 6.3, enters pressure tensor)
  alpha_meq: 1.0        # Eq.5 α parameter (paper: α=1); controls meq[1] = (-2+3α|u|²)ρ
  cs_a: 1.0             # Carnahan-Starling a (paper default)
  cs_b: 4.0             # Carnahan-Starling b (paper default)
  cs_R: 1.0             # Carnahan-Starling R (paper default)
  cs_T: 0.70            # REDUCED temperature Tr = T/Tc (paper Section 5: 0.9Tc; here 0.7Tc for strong density ratio)
  cs_G: -1.0            # interaction strength (paper default)
  huang_R0: 40.0        # initial droplet radius
  huang_xc: 128.0       # droplet center x (NX/2)
  huang_yc: 128.0       # droplet center y (NY/2)
  huang_W: 3.0          # interface thickness (tanh width)
  huang_init_mode: 1    # 1=droplet, 2=flat interface, 3=uniform liquid
  tau_huang: 1.5        # MRT relaxation τ (paper Section 6.3: τ=1.5)
  Lambda_huang: 0.083333 # magic parameter Λ=1/12 (paper: eliminates anisotropy)
  G_ads: 0.0             # SCMP adsorption force (0=disabled; use θ_contact instead)
  theta_contact_deg: 0.0 # ψ-based contact angle (0=disabled; e.g. 90.0 for neutral)
  huang_psi_l_ref: 0.15  # liquid reference ψ for cos²(θ/2) ghost BC
  huang_psi_g_ref: 0.01  # gas reference ψ for cos²(θ/2) ghost BC

# ── Numerical guards (rarely need tuning) ──
numerics:
  huang_u_max: 0.15       # velocity safety cap (|u| > UMAX → clipped)
  huang_psi_cut: 1.0e-3   # ψ² floor for Q_m kernel denominator
  huang_tanh_factor: 2.0  # init tanh steepness  tanh(factor×(R0−r)/W)
  huang_rho_max_init: 1.0 # init density upper clamp

# ── MRT relaxation ──
relaxation:
  tau_p_a: 1.0
  tau_p_b: 1.0
  kappa: 0.0
  GAB: 0.0
  GBA: 0.0
  sigmaA: 0.0

# ── Initial / driving (not used in SCMP) ──
scenario:
  init_eq: 0
  drive: 1

driving:
  Gx: 0.0
  Gy: 0.0
  drive_mode: 1

# ── Checkpoint ──
checkpoint:
  enable: false
  every: 5000
  keep: 2
  resume: 0

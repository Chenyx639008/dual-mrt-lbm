[project]
name = "lbm_mrt"
dynamic = ["version"]
description = "High-performance CUDA-based Multicomponent MRT-LBM solver template for multiphase flow and hydrate dissociation in porous media."
authors = [
    {name = "Yuxiang Chen", email = "yuxiangc22@mails.jlu.edu.cn"}
]
requires-python = ">=3.11"

dependencies = [
    "jax>=0.10.2",
    "jaxlib>=0.10.2",
    "matplotlib>=3.10.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scipy>=1.13",
]

[project.scripts]
lbm-build = "lbm_mrt.solver.build:main"
lbm-run   = "lbm_mrt.runners.single_run:main"
lbm-batch = "lbm_mrt.runners.batch_run:main"
lbm       = "lbm_mrt.unified.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.15.10",
    "mypy>=1.20.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
doc = [
    # NB: mkdocs v2 will include breaking changes.
    # See: https://github.com/ImperialCollegeLondon/python-template/discussions/530
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocstrings>=1.0.3",
    "mkdocstrings-python>=2.0.3",
    "mkdocs-material>=9.7.6",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-section-index>=0.3.11",
]

[tool.mypy]
disallow_any_explicit = true
disallow_any_generics = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = [".venv/", "docs/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
addopts = "-v -p no:warnings --cov=lbm_mrt --cov-branch --cov-report=html --cov-report=xml --doctest-modules --ignore=lbm_mrt/__main__.py --ignore=docs/ --ignore=lbm_mrt/solver/"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "D",   # pydocstyle
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "RUF", # ruff
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
]

[build-system]
requires = ["setuptools>=78", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "3.2.0"

[tool.setuptools.packages.find]
where   = ["."]
include = ["lbm_mrt*"]

[tool.setuptools.package-data]
"lbm_mrt.solver" = ["src/*.cu", "include/*.h", "include/*.cuh"]
